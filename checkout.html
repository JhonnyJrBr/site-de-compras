<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lojas Kadabra | Finalizar Compra</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="main-header checkout-header">
        <div class="header-container">
            <a href="index.html" class="back-link">← Voltar para a Loja</a>
            <h1 class="brand-logo">Lojas<span>Kadabra</span> | Checkout</h1>
        </div>
    </header>

    <main class="checkout-container">
      
        <section class="checkout-section summary-box">
            <h2>Revisar Itens</h2>
            <ul id="cart-items" class="cart-items-list">
                
            </ul>
            
            <div class="total-row">
                <span>Valor Total:</span>
                <span class="final-total">R$ <span id="cart-total-value">0,00</span></span>
            </div>
        </section>

     
        <section class="checkout-section payment-box">
            <h2>Dados de Pagamento</h2>
            <form id="payment-form" onsubmit="executeCheckout(event)">
                <div class="form-group">
                    <label for="card-name">Nome Impresso no Cartão</label>
                    <input type="text" id="card-name" required placeholder="João S Silva">
                </div>
                <div class="form-group">
                    <label for="card-number">Número do Cartão</label>
                    <input type="text" id="card-number" required placeholder="0000 0000 0000 0000">
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="card-expiry">Validade</label>
                        <input type="text" id="card-expiry" required placeholder="MM/AA">
                    </div>
                    <div class="form-group">
                        <label for="card-cvv">CVV</label>
                        <input type="text" id="card-cvv" required placeholder="123">
                    </div>
                </div>
                <button type="submit" class="submit-payment-btn">Confirmar e Pagar Agora</button>
            </form>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
